<!doctype html>
<html lang="en" data-theme="exorcist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypt Kit board mockups</title>
<style>
/* Crypt Kit board mockups. One self-contained file: no external CSS, JS or fonts. Mockup only. */
:root { color-scheme: dark; --font-display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; --font-body: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; --font-mono: ui-monospace, 'SF Mono', Menlo, monospace; }
[data-theme='exorcist'] { --bg:#0b0e14; --bg2:#0f131b; --surface:#151a24; --surface2:#1c2230; --line:#2a3243; --ink:#e9eef7; --muted:#a3adc0; --accent:#8ef0d8; --accent-ink:#062720; --glow:rgba(142,240,216,.16); --warn:#ffd27a; --danger:#ff9a8a; --good:#9be7a6; }
[data-theme='poltergeist'] { --bg:#120b10; --bg2:#170f15; --surface:#1e141b; --surface2:#281b24; --line:#3b2b36; --ink:#f6ecf2; --muted:#c4afbd; --accent:#ffb347; --accent-ink:#2b1700; --glow:rgba(255,179,71,.16); --warn:#ffd27a; --danger:#ff9a8a; --good:#a9e58f; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; padding-top: 42px; background: radial-gradient(1100px 520px at 75% -10%, var(--glow), transparent 60%), var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, textarea, input { font: inherit; color: inherit; }
a { color: inherit; }
.i { width: 18px; height: 18px; flex: none; } .i-lg { width: 28px; height: 28px; } .i-xl { width: 56px; height: 56px; }
:where(button, a, textarea, input, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
noscript { display: block; padding: 40px; font-size: 18px; }

/* Mockup chrome (not part of the design) */
.mockbar { position: fixed; inset: 0 0 auto 0; height: 42px; z-index: 100; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #050608; border-bottom: 1px dashed #3a3f4a; font: 500 12px/1 var(--font-body); color: #b8bfcc; overflow-x: auto; white-space: nowrap; }
.mockbar strong { color: #fff; }
.mockbar .seg { display: flex; gap: 4px; }
.mockbar .seg button { padding: 7px 10px; border-radius: 6px; border: 1px solid transparent; background: none; cursor: pointer; color: #b8bfcc; }
.mockbar .seg button[aria-pressed='true'] { border-color: #4a5160; color: #fff; background: #12151b; }
.mockbar .spacer { flex: 1; }

/* App header */
.app-head { display: flex; align-items: center; gap: 20px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: color-mix(in oklab, var(--bg) 82%, transparent); backdrop-filter: blur(10px); position: sticky; top: 42px; z-index: 20; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--surface)); box-shadow: 0 0 24px -4px var(--glow), inset 0 0 0 1px color-mix(in oklab, var(--accent) 30%, transparent); }
.brand-name { font: 700 21px/1 var(--font-display); }
.brand-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.stats { display: flex; gap: 22px; margin-left: auto; align-items: center; }
.stat { text-align: right; } .stat b { display: block; font: 700 23px/1 var(--font-display); } .stat span { font-size: 12px; color: var(--muted); } .stat.accent b { color: var(--accent); }

/* Buttons, pills */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; transition: border-color .15s, transform .15s, box-shadow .15s; }
.btn:hover { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 10px 28px -12px var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
/* Full opacity: these 11px labels must keep AA contrast, including on the accent buttons. */
kbd { font: 500 11px/1 var(--font-mono); padding: 3px 5px; border-radius: 5px; border: 1px solid currentColor; }
.pill { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font: 600 12px/1 var(--font-body); padding: 6px 10px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ready { color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent); }
.pill.busy .dot { animation: pulse 1.2s ease-in-out infinite; }
.pill.fail { color: var(--danger); background: color-mix(in oklab, var(--danger) 13%, transparent); }
.pill.check { color: var(--warn); background: color-mix(in oklab, var(--warn) 13%, transparent); }
.pill.wait { color: var(--muted); border: 1px dashed var(--line); background: transparent; }
/* Status colours for the creature icons in every layout. */
[data-status='draft_failed'], [data-status='action_failed'] { --status: var(--danger); }
[data-status='approving'] { --status: var(--warn); }
[data-status='new'] { --status: var(--muted); }
.mockbar .seg button.shortcuts[aria-pressed='false'] { color: #ffb4a8; }
.sev { font: 600 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); } .sev-high { color: var(--danger); } .sev-medium { color: var(--warn); }

/* Haunt detail (shared by every layout) */
.d-kicker { display: flex; align-items: center; gap: 10px; }
.d-title { font: 700 30px/1.15 var(--font-display); margin: 12px 0 8px; text-wrap: balance; }
.d-meta { color: var(--muted); margin: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.link { color: var(--accent); text-decoration: none; display: inline-flex; gap: 5px; align-items: center; font-weight: 500; } .link:hover { text-decoration: underline; } .link .i { width: 15px; height: 15px; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.fact { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 92px; }
.fact b { display: block; font: 600 16px/1.25 var(--font-body); } .fact span { font-size: 12px; color: var(--muted); }
.fact.good b { color: var(--good); } .fact.strike b { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.d-label { display: flex; align-items: center; gap: 8px; margin: 26px 0 10px; font: 600 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.d-label kbd { margin-left: auto; }
.d-summary { margin: 0; font-size: 16px; }
.d-proposal { width: 100%; min-height: 136px; resize: vertical; display: block; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; line-height: 1.6; }
.d-proposal:focus { border-color: color-mix(in oklab, var(--accent) 55%, var(--line)); outline: none; box-shadow: 0 0 0 4px var(--glow); }
.toggle { display: flex; align-items: center; gap: 12px; margin-top: 14px; cursor: pointer; width: fit-content; }
.toggle input { appearance: none; width: 38px; height: 22px; border-radius: 999px; margin: 0; cursor: pointer; background: var(--surface2); border: 1px solid var(--line); position: relative; }
.toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .18s; }
.toggle input:checked { background: color-mix(in oklab, var(--accent) 35%, var(--surface2)); } .toggle input:checked::after { transform: translateX(16px); background: var(--accent); }
.d-why { margin-top: 16px; color: var(--muted); } .d-why summary { cursor: pointer; width: fit-content; font-weight: 500; } .d-why p { margin: 8px 0 0; }
.d-actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; align-items: center; }
.d-actions .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
.notice { display: flex; gap: 12px; padding: 14px 16px; margin-top: 22px; border-radius: 12px; border: 1px solid color-mix(in oklab, var(--warn) 40%, var(--line)); background: color-mix(in oklab, var(--warn) 7%, var(--surface)); }
.notice.fail { border-color: color-mix(in oklab, var(--danger) 40%, var(--line)); background: color-mix(in oklab, var(--danger) 7%, var(--surface)); }
.notice .i { color: var(--warn); margin-top: 2px; } .notice.fail .i { color: var(--danger); } .notice p { margin: 4px 0 0; color: var(--muted); }
.skeleton { height: 12px; border-radius: 6px; margin: 10px 0; background: linear-gradient(90deg, var(--surface2), var(--line), var(--surface2)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.empty { display: grid; place-items: center; text-align: center; padding: 64px 24px; color: var(--muted); }
.empty .i-xl { color: var(--accent); margin-bottom: 14px; animation: bob 4s ease-in-out infinite; }
.empty h3 { font: 700 24px/1.2 var(--font-display); color: var(--ink); margin: 0 0 6px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); box-shadow: 0 18px 40px -16px #000; animation: toast-in .25s ease-out; }
.toast .i { color: var(--accent); }

/* ===== A · Triage queue ===== */
.va .layout { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; min-height: calc(100vh - 120px); }
.va .queue { border-right: 1px solid var(--line); padding: 14px 12px; }
.va .queue-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 10px 12px; color: var(--muted); font-size: 12px; }
.va .queue-head b { font: 700 16px/1 var(--font-display); color: var(--ink); }
.va .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.va .row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: background .15s, opacity .32s, transform .32s, filter .32s; }
.va .row:hover { background: var(--surface); }
.va .row[aria-selected='true'] { background: var(--surface); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent); }
.va .row-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
.va .row[data-status] .row-icon { color: var(--status, var(--accent)); }
.va .rows:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 12px; }
.va .row-main { min-width: 0; }
.va .row-title { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.va .row-meta { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.va .row .pill { font-size: 11px; padding: 5px 8px; }
.va .row.leave-approve { opacity: 0; transform: translateY(-14px) scale(.98); filter: blur(6px); }
.va .row.leave-spare { opacity: 0; transform: translateX(-24px); }
.va .keys { margin: 18px 10px 0; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--muted); }
.va .detail { padding: 34px 44px 60px; max-width: 820px; }
@media (max-width: 860px) { .va .layout { grid-template-columns: 1fr; } .va .queue { border-right: 0; border-bottom: 1px solid var(--line); } .va .detail { padding: 26px 20px 48px; } }

/* ===== B · Graveyard ===== */
.vb .hud { display: flex; align-items: center; gap: 18px; padding: 22px 28px 0; }
.vb .meter { flex: 1; max-width: 520px; }
.vb .meter-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; } .vb .meter-top b { color: var(--ink); }
.vb .bar { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; border: 1px solid var(--line); }
.vb .bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 55%, transparent), var(--accent)); box-shadow: 0 0 16px var(--accent); transition: width .5s ease; }
.vb .hud .keys { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
/* The yard fills the screen and the stones stand on a horizon in the middle, so a few haunts never leave a blank half-page. */
.vb .yard { position: relative; padding: 48px 28px 140px; overflow: hidden; min-height: calc(100vh - 190px); display: grid; align-content: center; }
.vb .yard::before { content: ''; position: absolute; left: 0; right: 0; top: 62%; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 35%, var(--line)), transparent); opacity: .5; }
.vb .graves { align-self: center; }
.vb .yard::after { content: ''; position: absolute; inset: auto -10% 0 -10%; height: 220px; pointer-events: none; background: radial-gradient(60% 100% at 30% 100%, color-mix(in oklab, var(--accent) 9%, transparent), transparent 70%), radial-gradient(50% 90% at 75% 100%, color-mix(in oklab, var(--muted) 10%, transparent), transparent 70%); animation: drift 18s ease-in-out infinite alternate; }
.vb .graves { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px 22px; position: relative; z-index: 1; }
.vb .grave { position: relative; padding: 46px 20px 20px; min-height: 250px; cursor: pointer; text-align: center; border-radius: 120px 120px 16px 16px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface2), var(--surface) 60%); box-shadow: 0 24px 40px -28px #000; transition: transform .2s, border-color .2s, box-shadow .2s, opacity .45s, filter .45s; }
.vb .grave:hover, .vb .grave.sel { transform: translateY(-4px); border-color: color-mix(in oklab, var(--accent) 50%, var(--line)); box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 30%, transparent), 0 26px 50px -24px var(--accent); }
.vb .spirit { position: absolute; top: -22px; left: calc(50% - 26px); width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--bg); box-shadow: 0 0 26px var(--glow), inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent); animation: bob 3.6s ease-in-out infinite; }
.vb .grave:nth-child(2n) .spirit { animation-delay: -1.2s; } .vb .grave:nth-child(3n) .spirit { animation-delay: -2.1s; }
.vb .grave[data-status] .spirit { color: var(--status, var(--accent)); } .vb .grave[data-status='drafting'] .spirit, .vb .grave[data-status='new'] .spirit { opacity: .6; }
/* A closed drawer is hidden from tab order and assistive tech; `visibility` waits for the slide-out to finish. */
.vb .drawer { visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s; }
.vb.open .drawer { visibility: visible; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s; }
.vb .grave h3 { font: 700 20px/1.2 var(--font-display); margin: 6px 0 8px; text-wrap: balance; }
.vb .g-meta { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
.vb .g-price { font: 700 27px/1 var(--font-display); color: var(--good); margin: 0 0 12px; } .vb .g-price s { font: 500 14px var(--font-body); color: var(--muted); margin-left: 6px; }
.vb .grave.leave-approve { opacity: 0; transform: translateY(-60px) scale(.92); filter: blur(10px); }
.vb .grave.leave-spare { opacity: 0; transform: translateY(30px) scale(.96); filter: grayscale(1); }
.vb .scrim { position: fixed; inset: 42px 0 0 0; background: rgb(0 0 0 / .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
.vb .drawer { position: fixed; top: 42px; right: 0; bottom: 0; width: min(640px, 100%); z-index: 31; background: var(--bg2); border-left: 1px solid var(--line); box-shadow: -30px 0 60px -30px #000; padding: 28px 34px 40px; overflow-y: auto; transform: translateX(100%); }
.vb.open .drawer { transform: none; } .vb.open .scrim { opacity: 1; pointer-events: auto; }
.vb .drawer .close { position: absolute; top: 18px; right: 18px; width: 40px; padding: 0; justify-content: center; }

/* ===== C · Séance ===== */
.vc .stage { max-width: 760px; margin: 0 auto; padding: 34px 24px 70px; }
.vc .progress { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
.vc .count { font: 700 16px/1 var(--font-display); white-space: nowrap; } .vc .count span { color: var(--muted); font: 400 13px var(--font-body); margin-left: 6px; }
.vc .dots { display: flex; gap: 6px; flex: 1; }
.vc .dots button { flex: 1; height: 6px; border: 0; border-radius: 999px; padding: 0; cursor: pointer; background: var(--surface2); transition: transform .2s; }
.vc .dots button[data-status='drafted'] { background: color-mix(in oklab, var(--accent) 40%, var(--surface2)); }
.vc .dots button[data-status='draft_failed'] { background: color-mix(in oklab, var(--danger) 45%, var(--surface2)); }
.vc .dots button[data-status='approving'] { background: color-mix(in oklab, var(--warn) 45%, var(--surface2)); }
.vc .dots button[data-status='action_failed'] { background: color-mix(in oklab, var(--danger) 45%, var(--surface2)); }
.vc .dots button[data-status='new'] { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.vc .dots button[aria-current='true'] { background: var(--accent); transform: scaleY(1.6); box-shadow: 0 0 10px var(--accent); }
.vc .nav { display: flex; gap: 6px; } .vc .nav .btn { width: 40px; padding: 0; justify-content: center; }
.vc .deck { position: relative; }
.vc .deck::before, .vc .deck::after { content: ''; position: absolute; left: 22px; right: 22px; height: 100%; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); z-index: 0; }
.vc .deck::before { top: 18px; left: 40px; right: 40px; opacity: .45; } .vc .deck::after { top: 9px; opacity: .8; }
.vc .deck[data-left='1']::before, .vc .deck[data-left='0']::before, .vc .deck[data-left='0']::after { display: none; }
.vc .card { position: relative; z-index: 1; border-radius: 22px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface2), var(--surface) 40%); padding: 34px 38px 32px; box-shadow: 0 40px 80px -40px #000; transition: transform .42s cubic-bezier(.2,.8,.2,1), opacity .42s, filter .42s; }
.vc .medium { position: absolute; top: -26px; right: 30px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--bg); box-shadow: 0 0 30px var(--glow), inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent); animation: bob 4s ease-in-out infinite; }
.vc .card.enter { opacity: 0; transform: translateY(18px) scale(.98); }
.vc .card.leave-approve { opacity: 0; transform: translateY(-80px) rotate(-2deg) scale(.96); filter: blur(8px); }
.vc .card.leave-spare { opacity: 0; transform: translateX(-120px) rotate(-6deg); }
.vc .card .d-actions .btn { height: 52px; padding: 0 22px; font-size: 16px; border-radius: 14px; }
.vc .help { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
@media (max-width: 640px) { .vc .card { padding: 28px 20px 24px; } }
/* Narrow phones (down to 320px): stack the header and HUD and wrap every row of controls, so nothing overflows sideways. */
@media (max-width: 600px) {
  .app-head { flex-wrap: wrap; padding: 14px 16px; gap: 12px; }
  .stats { margin-left: 0; width: 100%; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .stat { text-align: left; }
  .vb .hud { flex-wrap: wrap; padding: 16px 16px 0; }
  .vb .meter { max-width: none; width: 100%; }
  .vb .hud .keys { margin-left: 0; flex-wrap: wrap; gap: 8px 12px; }
  .vb .yard { padding: 40px 16px 120px; }
  .vb .graves { grid-template-columns: 1fr; }
  .va .keys, .vc .help { gap: 8px 12px; }
  .vc .stage { padding: 24px 14px 60px; }
  .vc .progress { flex-wrap: wrap; gap: 12px; }
  .vc .dots { order: 3; flex-basis: 100%; }
  .vc .nav { margin-left: auto; }
  .d-actions .hint { margin-left: 0; width: 100%; }
}

@keyframes pulse { 50% { opacity: .25; } } @keyframes shimmer { to { background-position: -200% 0; } }
@keyframes bob { 50% { transform: translateY(-6px); } } @keyframes drift { to { transform: translateX(6%); } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<noscript>These mockups need JavaScript. Open this file in a browser (Chrome or Safari).</noscript>
<div class="mockbar" id="mockbar"></div>
<header class="app-head" id="head"></header>
<div id="view"></div>
<script>
const ICONS = {
  ghost: '<path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',

/* ---------- Shared pieces ---------- */
const pill = (h) => { const [c, l] = t.status[h.status]; return `<span class="pill ${c}"><span class="dot"></span>${l}</span>`; };

function detail(h) {
  const head = `<div class="d-kicker">${pill(h)}<span class="sev sev-${h.sev}">${h.sev}</span></div>

  if (h.status === 'drafting') return `${head}<div class="d-label">${icon('spark')} Drafting</div>
    <div class="skeleton" style="width:92%"></div><div class="skeleton" style="width:78%"></div><div class="skeleton" style="width:60%"></div>
    <div class="d-actions"><button class="btn" type="button" data-act="spare" data-fk="spare">${icon('x')} ${t.spare} <kbd>R</kbd></button><span class="hint">You can spare it while the draft is written.</span></div>`;
  if (h.status === 'draft_failed') return `${head}<div class="notice fail">${icon('alert')}<div><strong>No draft this time</strong><p>${esc(h.error)} Nothing was sent anywhere.</p></div></div>
    <div class="d-actions"><button class="btn primary" type="button" data-act="redraft" data-fk="redraft">${icon('refresh')} Try again</button><button class="btn" type="button" data-act="spare" data-fk="spare">${icon('x')} ${t.spare} <kbd>R</kbd></button></div>`;
  if (h.status === 'approving') return `${head}<div class="notice">${icon('clock')}<div><strong>This may already have happened</strong>
    <p>The ${t.approve.toLowerCase()} started but its result wasn’t saved. Check the source before doing anything else. You can record what you find after ${h.unlocksAt}.</p></div></div>
    <div class="d-actions"><a class="btn" href="#" data-act="noop">${icon('external')} ${t.sourceLabel}</a><button class="btn" type="button" disabled>${icon('check')} It happened</button><button class="btn" type="button" disabled>${icon('x')} It didn’t</button><span class="hint">Unlocks at ${h.unlocksAt}</span></div>`;
  if (h.status === 'new') return `${head}<div class="notice">${icon('clock')}<div><strong>Waiting for a draft</strong>
    <p>${esc(h.waiting)} Nothing has been sent to the agent yet.</p></div></div>
    <div class="d-actions"><button class="btn" type="button" data-act="spare" data-fk="spare">${icon('x')} ${t.spare} <kbd>R</kbd></button><span class="hint">You can spare it before it’s drafted.</span></div>`;
  // Edits are saved into the haunt as you type (see the input handler), so they survive a re-render.
  const opts = Object.entries(h.options ?? {}).map(([k, v]) => `<label class="toggle"><input type="checkbox" data-opt="${esc(k)}" data-fk="opt-${esc(k)}" ${v ? 'checked' : ''}> ${esc(t.optionLabels[k] ?? k)}</label>`).join('');
  const failed = h.status === 'action_failed'

    : '';
  const approveLabel = h.status === 'action_failed' ? `${icon('refresh')} Try ${t.approve.toLowerCase()} again` : `${icon('check')} ${t.approve}`;
  return `${head}${failed}<div class="d-label">${icon('spark')} What the agent found</div><p class="d-summary">${esc(h.summary)}</p>
    <label class="d-label" for="proposal">${t.proposalLabel} <kbd>E</kbd></label><textarea id="proposal" class="d-proposal" data-fk="proposal" rows="5">${esc(h.proposal)}</textarea>${opts}

}

function toast(msg) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');

  document.body.append(el);
  setTimeout(() => el.remove(), 2600);
}

const params = new URLSearchParams(location.search);
let view = params.get('view') in VIEWS ? params.get('view') : 'b';
let themeId = params.get('theme') in THEMES ? params.get('theme') : 'exorcist';
let t, items, sel = 0, busy = false;
let gen = 0; // bumped on every reset, so timers from a previous theme or layout are ignored
let shortcutsOn = true;
const $view = document.getElementById('view');

function reset() {
  gen++;
  t = structuredClone(THEMES[themeId]); items = t.haunts; sel = 0; busy = false;
  items.forEach((h, i) => { h.id = `${themeId}-${i}`; });
  document.documentElement.dataset.theme = themeId;
  $view.className = 'v' + view;
  const url = new URL(location.href); url.searchParams.set('view', view); url.searchParams.set('theme', themeId);
  history.replaceState(null, '', url);
  render(true);
}

/* ?open=N opens haunt N's drawer on load (B only), so the detail can be screenshotted. */
function openFromUrl() {
  const n = Number(params.get('open'));
  if (view === 'b' && params.has('open') && items[n]) openDrawer(n);
}

/**
 * Re-renders, then puts focus back on the equivalent control. Every focusable control
 * carries a stable data-fk key (e.g. "grave-exorcist-1", "next"), so keyboard users
 * keep their place even though the markup is rebuilt.
 */
function render(animate = false) {
  const active = document.activeElement;
  const fk = active?.closest?.('[data-fk]')?.dataset.fk;
  const caret = active?.id === 'proposal' ? [active.selectionStart, active.selectionEnd, active.scrollTop] : null;
  draw(animate);
  if (!fk) return;
  const same = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
  const target = same && !same.closest('[inert]') ? same : fallbackFocus(fk);
  target?.focus({ preventScroll: true });
  if (caret && target?.id === 'proposal') {
    target.setSelectionRange(caret[0], caret[1]);
    target.scrollTop = caret[2];
  }
}

/**
 * Where focus goes when the focused control no longer exists (e.g. an acted-on grave, or
 * a Try again button that turned into an editor): stay in the drawer if it's open,
 * otherwise the selected item, otherwise the board's run button.
 */
function fallbackFocus(fk) {
  const pick = (sel) => document.querySelector(sel);
  if ($view.classList.contains('open')) return pick('.drawer [data-fk="proposal"]') || pick('.drawer [data-fk="close"]');
  if (view === 'b') return $view.querySelectorAll('.grave')[sel] || pick('[data-fk="summon"]');
  if (view === 'a') return pick('[data-fk="listbox"]') || pick('[data-fk="summon"]');
  return pick('[data-fk="next"]') || pick('[data-fk="summon"]');
}

function draw(animate) {
  document.getElementById('mockbar').innerHTML = `<strong>Crypt Kit board mockups</strong>
    <div class="seg" role="group" aria-label="Layout">${Object.entries(VIEWS).map(([k, l]) => `<button type="button" data-view="${k}" data-fk="view-${k}" aria-pressed="${k === view}">${l}</button>`).join('')}</div>
    <span class="spacer"></span><span>App theme</span>
    <div class="seg" role="group" aria-label="App theme">${Object.values(THEMES).map((x) => `<button type="button" data-theme-btn="${x.id}" data-fk="theme-${x.id}" aria-pressed="${x.id === themeId}">${x.name}</button>`).join('')}</div>
    <div class="seg"><button type="button" class="shortcuts" data-fk="shortcuts" data-shortcuts aria-pressed="${shortcutsOn}" title="Single-key shortcuts (A, R, E, J, K)">Shortcuts ${shortcutsOn ? 'on' : 'off'}</button></div>`;
  document.getElementById('head').innerHTML = `<div class="brand"><div class="brand-mark">${icon(t.creature, 'i-lg')}</div><div><div class="brand-name">${esc(t.name)}</div><div class="brand-sub">${esc(t.sub)}</div></div></div>
    <div class="stats"><div class="stat accent"><b>${items.length}</b><span>${t.openLabel}</span></div><div class="stat"><b>${t.score}</b><span>${t.scoreLabel}</span></div>
    <button class="btn" type="button" data-act="summon" data-fk="summon">${icon('wand')} ${t.summon}</button></div>`;
  ({ a: renderA, b: renderB, c: renderC })[view](animate);
}

function renderA() {
  $view.innerHTML = `<main class="layout"><section class="queue" aria-label="Haunts">
    <div class="queue-head"><b>Open haunts</b><span>Oldest first</span></div>
    <ul class="rows" role="listbox" tabindex="0" data-fk="listbox" aria-label="Open haunts" ${items[sel] ? `aria-activedescendant="opt-${items[sel].id}"` : ''}>${items.map((h, i) => `<li class="row" role="option" id="opt-${h.id}" data-i="${i}" data-status="${h.status}" aria-selected="${i === sel}">

function renderB() {
  const pct = Math.min(100, Math.round((t.score / t.weeklyGoal) * 100));
  const price = (h) => { const n = h.facts?.find((f) => f.label === 'Now'), w = h.facts?.find((f) => f.label === 'Was'); return n ? `<p class="g-price">${n.value}${w ? `<s>${w.value}</s>` : ''}</p>` : ''; };
  const wasOpen = $view.classList.contains('open');
  $view.innerHTML = `<div class="hud"><div class="meter"><div class="meter-top"><span><b>${t.score}</b> of ${t.weeklyGoal} ${t.scoreLabel}</span><span>${items.length} ${t.openLabel}</span></div>

      <div class="keys"><span><kbd>J</kbd> <kbd>K</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>A</kbd> approve</span><span><kbd>R</kbd> spare</span></div></div>
    <main class="yard"><ul class="graves" aria-label="Haunts">${items.length ? items.map((h, i) => `<li class="grave ${i === sel ? 'sel' : ''}" data-i="${i}" data-fk="grave-${h.id}" data-status="${h.status}" tabindex="0" role="button" aria-haspopup="dialog" aria-label="${esc(h.title)}, ${t.status[h.status][1]}">
      <span class="spirit">${icon(t.creature, 'i-lg')}</span><h3>${esc(h.title)}</h3><p class="g-meta">${esc(h.meta)}<br>${esc(h.age)}</p>${price(h)}${pill(h)}</li>`).join('') : `<li style="grid-column:1/-1">${emptyState()}</li>`}</ul></main>
    <div class="scrim" data-act="close"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="Haunt details"><button class="btn ghost close" type="button" data-act="close" data-fk="close" aria-label="Close">${icon('x')}</button><div aria-live="polite">${items[sel] ? detail(items[sel]) : ''}</div></aside>`;
  $view.classList.toggle('open', wasOpen && !!items[sel]);
  syncDrawer();
}

/**
 * Open: everything behind the drawer is inert, so focus and clicks stay in the dialog.
 * Closed: the drawer itself is inert (and hidden by CSS), so it's out of the tab order.
 */
function syncDrawer() {
  const open = view === 'b' && $view.classList.contains('open');
  const drawer = $view.querySelector('.drawer');
  if (drawer) drawer.inert = !open;
  for (const el of [document.getElementById('mockbar'), document.getElementById('head'), $view.querySelector('.hud'), $view.querySelector('.yard')]) {
    if (el) el.inert = open;
  }
}

function renderC(animate) {

  $view.innerHTML = `<main class="stage">

      <div class="dots" aria-label="Haunts">${items.map((h, i) => `<button type="button" data-go="${i}" data-fk="dot-${h.id}" data-status="${h.status}" aria-label="${esc(h.title)}" ${i === sel ? 'aria-current="true"' : ''}></button>`).join('')}</div>

    <div class="help"><span><kbd>A</kbd> approve</span><span><kbd>R</kbd> spare</span><span><kbd>E</kbd> edit</span><span><kbd>J</kbd> <kbd>K</kbd> next and previous</span></div></main>`;
  if (animate) requestAnimationFrame(() => requestAnimationFrame(() => $view.querySelector('.card')?.classList.remove('enter')));
}

/* ---------- Actions ---------- */
function select(i, animate = true) {
  if (!items.length) return;
  sel = (i + items.length) % items.length;
  render(view === 'c' && animate);
  if (view === 'b') $view.querySelectorAll('.grave')[sel]?.focus();
}
const openDrawer = (i) => {
  // Render the new content into the still-closed drawer, let it lay out off-screen,
  // then open that same element, so it slides in instead of appearing in place.
  const wasOpen = $view.classList.contains('open');
  sel = i;
  render();
  if (!wasOpen) {
    $view.querySelector('.drawer')?.getBoundingClientRect();
    $view.classList.add('open');
    syncDrawer();
  }
  $view.querySelector('.drawer .close')?.focus();
};
const closeDrawer = () => {
  $view.classList.remove('open');
  syncDrawer();
  $view.querySelectorAll('.grave')[sel]?.focus();
};

const APPROVABLE = ['drafted', 'action_failed'];
const SPARABLE = ['new', 'drafting', 'drafted', 'draft_failed', 'action_failed'];

function resolve(kind) {
  const h = items[sel];
  if (!h || busy) return;
  if (kind === 'approve' && !APPROVABLE.includes(h.status)) return;
  if (kind === 'spare' && !SPARABLE.includes(h.status)) return;
  busy = true;
  const started = gen;
  if (view === 'b') closeDrawer();
  const el = view === 'a' ? $view.querySelectorAll('.row')[sel] : view === 'b' ? $view.querySelectorAll('.grave')[sel] : $view.querySelector('.card');
  el?.classList.add('leave-' + kind);
  setTimeout(() => {
    // Remove the haunt that was acted on, by identity: the selection may have moved
    // during the animation, and a theme or layout switch makes this callback stale.
    if (started !== gen) return;
    busy = false;
    const idx = items.indexOf(h);
    if (idx < 0) return;
    items.splice(idx, 1);
    if (idx < sel) sel--;
    sel = Math.min(sel, Math.max(items.length - 1, 0));
    if (kind === 'approve') t.score++;
    render(true);
    toast(kind === 'approve' ? t.approved : t.spared);
  }, reducedMotion() ? 0 : { a: 320, b: 450, c: 420 }[view]);
}

function redraft() {
  const h = items[sel];
  const started = gen;
  h.status = 'drafting'; render();
  setTimeout(() => {
    if (started !== gen || !items.includes(h)) return;
    Object.assign(h, h.retry, { status: 'drafted' });
    render();
  }, reducedMotion() ? 0 : 1400);
}

/* Save edits into the haunt as they happen, so closing the drawer or re-rendering keeps them. */
document.addEventListener('input', (e) => {
  if (e.target.id === 'proposal' && items[sel]) items[sel].proposal = e.target.value;
});
document.addEventListener('change', (e) => {
  const key = e.target.dataset?.opt;
  if (key && items[sel]?.options && Object.hasOwn(items[sel].options, key)) items[sel].options[key] = e.target.checked;
});

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-shortcuts]')) { shortcutsOn = !shortcutsOn; return render(); }
  const v = e.target.closest('[data-view]'); if (v) { view = v.dataset.view; return reset(); }
  const th = e.target.closest('[data-theme-btn]'); if (th) { themeId = th.dataset.themeBtn; return reset(); }
  const go = e.target.closest('[data-go]'); if (go) return select(Number(go.dataset.go));
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act) {
    e.preventDefault();
    if (act === 'approve' || act === 'spare') resolve(act);
    else if (act === 'redraft') redraft();
    else if (act === 'close') closeDrawer();
    else if (act === 'summon') toast('Summoned. No new haunts.');
    return;
  }
  const row = e.target.closest('.row'); if (row) return select(Number(row.dataset.i));
  const grave = e.target.closest('.grave'); if (grave) return openDrawer(Number(grave.dataset.i));
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const drawerOpen = $view.classList.contains('open');
  // Escape closes the open drawer from anywhere inside it, including the editor.
  if (key === 'escape' && drawerOpen) { e.preventDefault(); return closeDrawer(); }
  if (e.target.closest('textarea, input')) { if (key === 'escape') e.target.blur(); return; }

  // Standard keys that always work, whatever the shortcut setting.
  const grave = e.target.closest?.('.grave');
  if (grave && (key === 'enter' || key === ' ')) { e.preventDefault(); return openDrawer(Number(grave.dataset.i)); }
  if (e.target.closest?.('[role="listbox"]')) {
    const move = { arrowdown: sel + 1, arrowup: sel - 1, home: 0, end: items.length - 1 }[key];
    if (move !== undefined) { e.preventDefault(); return select(Math.max(0, Math.min(items.length - 1, move))); }
  }

  // Single-key shortcuts: only on the board itself (not the mockup toolbar), and only when switched on.
  if (!shortcutsOn || e.target.closest('.mockbar')) return;
  // Act on the focused grave, not a stale selection.
  if (grave && !drawerOpen) sel = Number(grave.dataset.i);
  const handlers = {
    j: () => !drawerOpen && select(sel + 1), k: () => !drawerOpen && select(sel - 1),
    arrowright: () => view === 'b' && !drawerOpen && select(sel + 1), arrowleft: () => view === 'b' && !drawerOpen && select(sel - 1),
    a: () => resolve('approve'), r: () => resolve('spare'),
    e: () => { if (view === 'b' && !drawerOpen) openDrawer(sel); setTimeout(() => document.getElementById('proposal')?.focus(), 60); },
  };
  if (handlers[key]) { e.preventDefault(); handlers[key](); }
});

reset();
openFromUrl();
</script>
</body>
</html>
